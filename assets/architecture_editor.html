<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchWeb — Визуальная архитектура и связи</title>
  <style>
    :root {
      --bg: #0f141d;
      --panel: #161d2a;
      --panel-2: #1d2637;
      --border: #2c3a52;
      --text: #e6edf7;
      --muted: #93a4bd;
      --accent: #60a5fa;
      --ok: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: 54px 1fr;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      font-size: 15px;
    }
    .brand input {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 600;
      width: 260px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.primary { background: #1d4ed8; border-color: #3b82f6; }
    button.danger { color: #fecaca; border-color: #7f1d1d; }
    .status-pill {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
    }
    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 54px);
    }
    #stage {
      position: relative;
      overflow: hidden;
      background-color: #0b1018;
      background-image: radial-gradient(#1f2a3d 1px, transparent 1px);
      background-size: 22px 22px;
      cursor: grab;
    }
    #stage.panning { cursor: grabbing; }
    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 4000px;
      height: 3000px;
      transform-origin: 0 0;
    }
    svg#edges-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 4000px;
      height: 3000px;
      overflow: visible;
      pointer-events: stroke;
    }
    .node-card {
      position: absolute;
      width: 220px;
      min-height: 82px;
      border-radius: 11px;
      padding: 10px 12px;
      background: #162032;
      border: 1.5px solid #354969;
      box-shadow: 0 10px 24px rgba(0,0,0,0.38);
      cursor: move;
      transition: box-shadow 0.12s, border-color 0.12s;
    }
    .node-card.selected {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96,165,250,0.35), 0 12px 26px rgba(0,0,0,0.5);
    }
    .node-card[data-kind="client"]   { border-left: 5px solid #60a5fa; }
    .node-card[data-kind="gateway"]  { border-left: 5px solid #a78bfa; }
    .node-card[data-kind="service"]  { border-left: 5px solid #34d399; }
    .node-card[data-kind="worker"]   { border-left: 5px solid #2dd4bf; }
    .node-card[data-kind="queue"]    { border-left: 5px solid #fb923c; }
    .node-card[data-kind="cache"]    { border-left: 5px solid #facc15; }
    .node-card[data-kind="db"]       { border-left: 5px solid #f472b6; }
    .node-card[data-kind="external"] { border-left: 5px solid #94a3b8; }
    .node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 650;
      margin-bottom: 4px;
    }
    .node-meta {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node-path {
      margin-top: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #93c5fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port {
      position: absolute;
      right: -8px;
      top: calc(50% - 8px);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid #0f141d;
      cursor: crosshair;
    }
    .port:hover { transform: scale(1.25); background: #93c5fd; }
    aside {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px;
      overflow-y: auto;
      user-select: text;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 4px;
    }
    input[type="text"], textarea, aside select {
      width: 100%;
      background: #111826;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    textarea {
      min-height: 62px;
      resize: vertical;
      font-family: inherit;
    }
    pre#mermaid-box {
      margin: 0;
      max-height: 190px;
      overflow: auto;
      padding: 8px;
      border-radius: 6px;
      background: #0b1018;
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: #cbd5e1;
    }
    .edge-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .edge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      padding: 5px 7px;
      border-radius: 6px;
      background: #111826;
    }
    .hint-bar {
      position: absolute;
      left: 14px;
      bottom: 12px;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(22,29,42,0.88);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🏗️ ArchWeb</span>
      <input id="doc-title" type="text" placeholder="Название схемы" />
      <select id="doc-dir" title="Направление Mermaid">
        <option value="LR">Поток: Слева → Направо (LR)</option>
        <option value="TD">Поток: Сверху → Вниз (TD)</option>
      </select>
    </div>
    <div class="toolbar">
      <button id="btn-add" class="primary">＋ Компонент</button>
      <button id="btn-layout">📐 Авто-слои</button>
      <button id="btn-scan">🔍 Сканировать код</button>
      <button id="btn-reset-view">🎯 Центрировать</button>
      <button id="btn-save">💾 Сохранить</button>
      <span id="save-state" class="status-pill">Готово</span>
    </div>
  </header>

  <main>
    <div id="stage">
      <div id="world">
        <svg id="edges-layer">
          <defs>
            <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"></path>
            </marker>
            <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"></path>
            </marker>
            <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"></path>
            </marker>
          </defs>
          <g id="edges-group"></g>
          <path id="draft-edge" d="" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5" fill="none"></path>
        </svg>
        <div id="nodes-layer"></div>
      </div>
      <div class="hint-bar">
        Перетаскивай карточки мышью · Тяни за синюю точку ● справа, чтобы соединить узлы · Колесо мыши — масштаб · Клик по фону — панорама
      </div>
    </div>

    <aside>
      <div class="card" id="inspector-card">
        <h3>Инспектор компонента</h3>
        <div id="no-selection" style="font-size:13px;color:var(--muted);">
          Выбери карточку на холсте или нажми «＋ Компонент».
        </div>
        <div id="node-form" style="display:none;">
          <label>Название</label>
          <input type="text" id="f-label" />
          <label>Роль в архитектуре</label>
          <select id="f-kind">
            <option value="client">🖥️ Клиент / UI</option>
            <option value="gateway">🚪 API / Шлюз</option>
            <option value="service">⚙️ Сервис / Модуль</option>
            <option value="worker">🔄 Воркер / Джоба</option>
            <option value="queue">📨 Очередь / Шина</option>
            <option value="cache">⚡ Кеш / In-Memory</option>
            <option value="db">🗄️ База данных</option>
            <option value="external">🌐 Внешний API</option>
          </select>
          <label>Технология / стек</label>
          <input type="text" id="f-tech" placeholder="Go, PostgreSQL, Redis…" />
          <label>Путь к коду в проекте</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="f-path" placeholder="internal/orders" />
            <button id="btn-open-nvim" title="Открыть этот путь прямо в Neovim">📂</button>
          </div>
          <label>Описание</label>
          <textarea id="f-summary" placeholder="За что отвечает модуль…"></textarea>
          <div style="margin-top:10px;display:flex;justify-content:space-between;">
            <button id="btn-delete-node" class="danger">Удалить узел</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Связи (<span id="edge-count">0</span>)</h3>
        <div id="edge-list" class="edge-list"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3 style="margin:0;">Mermaid (docs/architecture.mmd)</h3>
          <button id="btn-copy-mmd" style="padding:3px 8px;font-size:11.5px;">Копировать</button>
        </div>
        <pre id="mermaid-box"></pre>
      </div>
    </aside>
  </main>

  <script>
    const ICONS = {
      client: "🖥️", gateway: "🚪", service: "⚙️", worker: "🔄",
      queue: "📨", cache: "⚡", db: "🗄️", external: "🌐"
    };
    const TIERS = {
      client: 1, gateway: 2, service: 3, worker: 3,
      queue: 4, cache: 4, db: 4, external: 4
    };

    let doc = { version: 1, title: "Архитектура", direction: "LR", nodes: [], edges: [] };
    let selectedId = null;
    let pan = { x: 40, y: 40, scale: 1 };
    let saveTimer = null;
    let connectFromId = null;

    const stage = document.getElementById("stage");
    const world = document.getElementById("world");
    const nodesLayer = document.getElementById("nodes-layer");
    const edgesGroup = document.getElementById("edges-group");
    const draftEdge = document.getElementById("draft-edge");
    const saveState = document.getElementById("save-state");

    function applyTransform() {
      world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${pan.scale})`;
    }

    function slug(s) {
      let out = String(s || "").toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
      if (!out) out = "node";
      if (/^[0-9]/.test(out)) out = "n_" + out;
      return out;
    }

    function setStatus(text) {
      saveState.textContent = text;
    }

    function scheduleSave() {
      setStatus("Сохранение…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 320);
    }

    async function saveNow() {
      clearTimeout(saveTimer);
      try {
        const res = await fetch("/api/architecture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ doc })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById("mermaid-box").textContent = data.mermaid || "";
          setStatus("Сохранено ✓");
        } else {
          setStatus("Ошибка сохранения");
        }
      } catch (e) {
        setStatus("Нет связи с Neovim");
      }
    }

    function findNode(id) {
      return doc.nodes.find(n => n.id === id);
    }

    function renderEdges() {
      edgesGroup.innerHTML = "";
      doc.edges.forEach((e, idx) => {
        const a = findNode(e.from);
        const b = findNode(e.to);
        if (!a || !b) return;
        const x1 = (a.x || 0) + 220;
        const y1 = (a.y || 0) + 41;
        const x2 = (b.x || 0);
        const y2 = (b.y || 0) + 41;
        const dx = Math.max(60, Math.abs(x2 - x1) * 0.45);
        const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

        const kind = e.kind || "sync";
        const color = kind === "async" ? "#fb923c" : (kind === "data" ? "#34d399" : "#60a5fa");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", kind === "data" ? "3" : "2.2");
        if (kind === "async") path.setAttribute("stroke-dasharray", "6,5");
        path.setAttribute("marker-end", `url(#arrow-${kind})`);
        edgesGroup.appendChild(path);

        if (e.label) {
          const tx = (x1 + x2) / 2;
          const ty = (y1 + y2) / 2 - 7;
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", tx);
          label.setAttribute("y", ty);
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("fill", "#cbd5e1");
          label.setAttribute("font-size", "11.5");
          label.textContent = e.label;
          edgesGroup.appendChild(label);
        }
      });

      document.getElementById("edge-count").textContent = String(doc.edges.length);
      const list = document.getElementById("edge-list");
      list.innerHTML = "";
      doc.edges.forEach((e, idx) => {
        const row = document.createElement("div");
        row.className = "edge-row";
        const arrow = e.kind === "async" ? "╌╌▶" : (e.kind === "data" ? "══▶" : "──▶");
        const text = document.createElement("span");
        text.textContent = `${e.from} ${arrow} ${e.to}${e.label ? " [" + e.label + "]" : ""}`;
        const del = document.createElement("button");
        del.textContent = "✕";
        del.style.padding = "2px 6px";
        del.onclick = () => {
          doc.edges.splice(idx, 1);
          renderAll();
          scheduleSave();
        };
        row.appendChild(text);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function renderInspector() {
      const n = findNode(selectedId);
      const empty = document.getElementById("no-selection");
      const form = document.getElementById("node-form");
      if (!n) {
        empty.style.display = "block";
        form.style.display = "none";
        return;
      }
      empty.style.display = "none";
      form.style.display = "block";
      document.getElementById("f-label").value = n.label || "";
      document.getElementById("f-kind").value = n.kind || "service";
      document.getElementById("f-tech").value = n.tech || "";
      document.getElementById("f-path").value = n.path || "";
      document.getElementById("f-summary").value = n.summary || "";
    }

    function renderNodes() {
      nodesLayer.innerHTML = "";
      doc.nodes.forEach(n => {
        const card = document.createElement("div");
        card.className = "node-card" + (n.id === selectedId ? " selected" : "");
        card.dataset.id = n.id;
        card.dataset.kind = n.kind || "service";
        card.style.left = (n.x || 0) + "px";
        card.style.top = (n.y || 0) + "px";

        const head = document.createElement("div");
        head.className = "node-head";
        head.textContent = `${ICONS[n.kind] || "⚙️"} ${n.label}`;

        const meta = document.createElement("div");
        meta.className = "node-meta";
        meta.textContent = n.tech || n.summary || n.kind;

        card.appendChild(head);
        card.appendChild(meta);
        if (n.path) {
          const p = document.createElement("div");
          p.className = "node-path";
          p.textContent = n.path;
          card.appendChild(p);
        }

        const port = document.createElement("div");
        port.className = "port";
        port.title = "Потяни к другой карточке, чтобы создать связь";
        port.addEventListener("mousedown", ev => {
          ev.stopPropagation();
          connectFromId = n.id;
        });
        card.appendChild(port);

        card.addEventListener("mousedown", ev => {
          if (ev.target === port) return;
          ev.stopPropagation();
          selectedId = n.id;
          renderInspector();
          document.querySelectorAll(".node-card").forEach(el => {
            el.classList.toggle("selected", el.dataset.id === selectedId);
          });

          const startX = ev.clientX;
          const startY = ev.clientY;
          const origX = n.x || 0;
          const origY = n.y || 0;

          function onMove(me) {
            n.x = Math.round(origX + (me.clientX - startX) / pan.scale);
            n.y = Math.round(origY + (me.clientY - startY) / pan.scale);
            card.style.left = n.x + "px";
            card.style.top = n.y + "px";
            renderEdges();
          }
          function onUp() {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            scheduleSave();
          }
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        card.addEventListener("mouseup", ev => {
          if (connectFromId && connectFromId !== n.id) {
            ev.stopPropagation();
            const from = connectFromId;
            connectFromId = null;
            draftEdge.setAttribute("d", "");
            const label = window.prompt("Подпись связи (например HTTP, gRPC, SQL, Kafka):", "") || "";
            const kind = window.prompt("Тип связи: sync (обычная) / async (событие) / data (БД):", "sync") || "sync";
            doc.edges.push({ from, to: n.id, label, kind: ["sync","async","data"].includes(kind) ? kind : "sync" });
            renderAll();
            scheduleSave();
          }
        });

        nodesLayer.appendChild(card);
      });
    }

    function renderAll() {
      document.getElementById("doc-title").value = doc.title || "";
      document.getElementById("doc-dir").value = doc.direction || "LR";
      renderNodes();
      renderEdges();
      renderInspector();
    }

    stage.addEventListener("mousedown", ev => {
      if (ev.target !== stage && ev.target !== world && ev.target.tagName !== "svg") return;
      stage.classList.add("panning");
      const sx = ev.clientX - pan.x;
      const sy = ev.clientY - pan.y;
      function onMove(me) {
        pan.x = me.clientX - sx;
        pan.y = me.clientY - sy;
        applyTransform();
      }
      function onUp() {
        stage.classList.remove("panning");
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
      }
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
    });

    window.addEventListener("mousemove", ev => {
      if (!connectFromId) return;
      const src = findNode(connectFromId);
      if (!src) return;
      const rect = stage.getBoundingClientRect();
      const mx = (ev.clientX - rect.left - pan.x) / pan.scale;
      const my = (ev.clientY - rect.top - pan.y) / pan.scale;
      const x1 = (src.x || 0) + 220;
      const y1 = (src.y || 0) + 41;
      draftEdge.setAttribute("d", `M ${x1} ${y1} L ${mx} ${my}`);
    });

    window.addEventListener("mouseup", () => {
      if (connectFromId) {
        connectFromId = null;
        draftEdge.setAttribute("d", "");
      }
    });

    stage.addEventListener("wheel", ev => {
      ev.preventDefault();
      const factor = ev.deltaY < 0 ? 1.08 : 0.92;
      pan.scale = Math.min(2.2, Math.max(0.35, pan.scale * factor));
      applyTransform();
    }, { passive: false });

    document.getElementById("doc-title").addEventListener("input", ev => {
      doc.title = ev.target.value;
      scheduleSave();
    });
    document.getElementById("doc-dir").addEventListener("change", ev => {
      doc.direction = ev.target.value;
      scheduleSave();
    });

    ["label", "kind", "tech", "path", "summary"].forEach(field => {
      document.getElementById("f-" + field).addEventListener("input", ev => {
        const n = findNode(selectedId);
        if (!n) return;
        n[field] = ev.target.value;
        renderNodes();
        renderEdges();
        scheduleSave();
      });
    });

    document.getElementById("btn-add").onclick = () => {
      const label = window.prompt("Название компонента:", "Новый сервис");
      if (!label) return;
      let id = slug(label);
      let idx = 2;
      while (findNode(id)) { id = slug(label) + "_" + idx++; }
      const n = { id, label, kind: "service", x: 380, y: 120 + (doc.nodes.length % 5) * 110, path: "", tech: "", summary: "" };
      doc.nodes.push(n);
      selectedId = n.id;
      renderAll();
      scheduleSave();
    };

    document.getElementById("btn-delete-node").onclick = () => {
      if (!selectedId) return;
      doc.nodes = doc.nodes.filter(n => n.id !== selectedId);
      doc.edges = doc.edges.filter(e => e.from !== selectedId && e.to !== selectedId);
      selectedId = doc.nodes[0] ? doc.nodes[0].id : null;
      renderAll();
      scheduleSave();
    };

    document.getElementById("btn-layout").onclick = () => {
      const buckets = { 1: [], 2: [], 3: [], 4: [] };
      doc.nodes.forEach(n => buckets[TIERS[n.kind] || 3].push(n));
      const xs = { 1: 80, 2: 360, 3: 650, 4: 960 };
      [1, 2, 3, 4].forEach(t => {
        buckets[t].forEach((n, i) => { n.x = xs[t]; n.y = 80 + i * 125; });
      });
      renderAll();
      scheduleSave();
    };

    document.getElementById("btn-scan").onclick = async () => {
      setStatus("Сканирование кода…");
      const res = await fetch("/api/scan", { method: "POST" });
      const data = await res.json();
      if (data.ok) {
        doc = data.doc;
        selectedId = doc.nodes[0] ? doc.nodes[0].id : null;
        document.getElementById("mermaid-box").textContent = data.mermaid || "";
        renderAll();
        setStatus("Код отсканирован ✓");
      }
    };

    document.getElementById("btn-open-nvim").onclick = async () => {
      const n = findNode(selectedId);
      if (!n || !n.path) return alert("Сначала укажи путь к файлу или папке в проекте.");
      const res = await fetch("/api/open-path", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: n.path })
      });
      const data = await res.json();
      if (data.ok) setStatus("Открыто в Neovim ✓");
      else alert(data.error || "Файл не найден");
    };

    document.getElementById("btn-reset-view").onclick = () => {
      pan = { x: 40, y: 40, scale: 1 };
      applyTransform();
    };
    document.getElementById("btn-save").onclick = saveNow;
    document.getElementById("btn-copy-mmd").onclick = () => {
      navigator.clipboard.writeText(document.getElementById("mermaid-box").textContent || "");
      setStatus("Mermaid скопирован ✓");
    };

    async function boot() {
      applyTransform();
      const res = await fetch("/api/architecture");
      const data = await res.json();
      if (data.ok && data.doc) {
        doc = data.doc;
        selectedId = doc.nodes[0] ? doc.nodes[0].id : null;
        document.getElementById("mermaid-box").textContent = data.mermaid || "";
        renderAll();
      }
    }
    boot();
  </script>
</body>
</html>
